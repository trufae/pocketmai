name: Release

on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: write

jobs:
  cli:
    name: CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
            target: linux-x64
            runner_arch: x86_64
          - os: ubuntu-24.04-arm
            name: Linux arm64
            target: linux-arm64
            runner_arch: aarch64
          - os: macos-26-intel
            name: macOS x64
            target: macos-x64
            runner_arch: x86_64
          - os: macos-26
            name: macOS arm64
            target: macos-arm64
            runner_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version and verify architecture
        run: |
          swift --version
          test "$(uname -m)" = "${{ matrix.runner_arch }}"

      - name: Install Linux static-link dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libxml2-dev

      - name: Build release CLI
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            swift build --package-path MaiCore -c release --product pmai \
              --static-swift-stdlib -Xswiftc -Osize
            strip -s MaiCore/.build/release/pmai
          else
            swift build --package-path MaiCore -c release --product pmai -Xswiftc -Osize
            strip -x MaiCore/.build/release/pmai
          fi

      - name: Package CLI
        run: |
          asset="pmai-${{ matrix.target }}.zip"
          zip -j "$asset" MaiCore/.build/release/pmai
          unzip -l "$asset"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: pmai-${{ matrix.target }}
          path: pmai-${{ matrix.target }}.zip
          if-no-files-found: error

  android-cli:
    name: CLI (Android arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift 6.3.3
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"

      - name: Install Android NDK and Swift SDK
        run: |
          set -eu
          ndk="$RUNNER_TEMP/android-ndk-r27d"
          curl -fL -o "$RUNNER_TEMP/android-ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"

          swift sdk install \
            https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz \
            --checksum d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5
          swift_sdk_root="${XDG_CONFIG_HOME:-$HOME/.config}/swiftpm/swift-sdks"
          android_sdk="$swift_sdk_root/swift-6.3.3-RELEASE_android.artifactbundle/swift-android"
          ANDROID_NDK_HOME="$ndk" bash "$android_sdk/scripts/setup-android-sdk.sh"

      - name: Build Android arm64 release CLI
        run: |
          swift build --package-path MaiCore -c release --product pmai \
            --swift-sdk aarch64-unknown-linux-android28 --static-swift-stdlib \
            -Xswiftc -Osize

      - name: Package Android CLI
        run: |
          set -eu
          package="$RUNNER_TEMP/pmai-android-arm64"
          mkdir -p "$package"
          cp MaiCore/.build/aarch64-unknown-linux-android28/release/pmai "$package/pmai"
          cp "$RUNNER_TEMP/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$package/"
          "$RUNNER_TEMP/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" -x "$package/pmai"
          (cd "$package" && zip -9 "$GITHUB_WORKSPACE/pmai-android-arm64.zip" pmai libc++_shared.so)
          unzip -l pmai-android-arm64.zip

      - name: Upload Android CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: pmai-android-arm64
          path: pmai-android-arm64.zip
          if-no-files-found: error

  ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select latest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null \
            | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      # Keep releases independent of private signing credentials. The IPA can
      # be signed after download with the user's own Apple identity.
      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project PocketMai.xcodeproj \
            -scheme PocketMai \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -eu
          app=build/DerivedData/Build/Products/Release-iphoneos/PocketMai.app
          test -d "$app"

          package="$RUNNER_TEMP/PocketMai-ipa"
          mkdir -p "$package/Payload"
          ditto "$app" "$package/Payload/PocketMai.app"

          safe_tag=$(printf '%s' "$GITHUB_REF_NAME" \
            | tr -c '[:alnum:]._-' '-')
          asset="PocketMai-$safe_tag.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$package/Payload" "$asset"
          unzip -tqq "$asset"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: pocketmai-ipa
          path: PocketMai-*.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [cli, android-cli, ipa]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true

      - name: Generate CLI checksums
        run: |
          cd release-assets
          sha256sum pmai-*.zip > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: PocketMai ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
